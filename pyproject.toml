[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-gis"
version = "0.1.0"
description = "A reproducible GIS and remote sensing portfolio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "geopandas>=1.0,<2",
  "shapely>=2.0,<3",
  "pyproj>=3.6,<4",
  "rasterio>=1.3,<2",
  "numpy>=1.26,<3",
  "matplotlib>=3.8,<4",
  "Jinja2>=3.1,<4",
  "Pillow>=10,<13",
  "requests>=2.31,<3",
]

[project.scripts]
portfolio-build = "portfolio_gis.build:main"
portfolio-maps = "portfolio_gis.gis.generate:main"

[tool.setuptools.packages.find]
include = ["portfolio_gis*"]
